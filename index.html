<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luxury Digital Card</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0f2027;
  overflow:hidden;
  perspective:1200px;
}

/* Animated gradient background */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:linear-gradient(45deg,#0f2027,#203a43,#2c5364,#1c1c1c);
  background-size:400% 400%;
  animation:gradientMove 12s ease infinite;
  z-index:-2;
}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* Floating particles */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  background:rgba(255,255,255,0.4);
  border-radius:50%;
  animation:floatUp 10s linear infinite;
}
@keyframes floatUp{from{transform:translateY(100vh);opacity:0}10%{opacity:1}to{transform:translateY(-10vh);opacity:0}}

/* Splash */
.splash{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  opacity:0;
  animation:fadeIn 1.5s ease forwards;
}
.splash img{
  width:240px;
  opacity:0;
  animation:logoFadeIn 1.5s ease forwards;
}
@keyframes logoFadeIn{to{opacity:1;}}
@keyframes fadeIn{to{opacity:1;}}

/* Glass card */
.card{
  width:92%;
  max-width:420px;
  padding:40px 25px;
  border-radius:30px;
  backdrop-filter:blur(30px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 25px 60px rgba(0,0,0,0.6);
  text-align:center;
  color:#fff;
  transform:rotateX(10deg) rotateY(-10deg);
  transition:transform .4s ease, opacity .6s ease;
  opacity:0;
  animation:cardIn 1s ease 1.6s forwards;
}
@keyframes cardIn{to{opacity:1;transform:rotateX(0) rotateY(0)}}

.profile-img{
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:15px;
  border:3px solid rgba(255,255,255,0.5);
  box-shadow:0 15px 40px rgba(0,0,0,0.7);
}

h2{font-size:22px;margin-bottom:5px;letter-spacing:1px}
.position{font-size:14px;color:#ddd;margin-bottom:30px}

.link-button{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 20px;
  margin-bottom:15px;
  border-radius:50px;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25);
  opacity:0;
  transform:translateY(20px);
  animation:fadeButton .6s ease forwards;
}
.link-button:nth-of-type(1){animation-delay:1.8s}
.link-button:nth-of-type(2){animation-delay:2s}
.link-button:nth-of-type(3){animation-delay:2.2s}
@keyframes fadeButton{to{opacity:1;transform:translateY(0)}}
.link-button:hover{background:rgba(255,255,255,0.3);transform:scale(1.05);}
.link-left{display:flex;align-items:center;gap:12px}

.save-contact{
  margin-top:10px;
  padding:12px;
  border-radius:40px;
  border:none;
  width:100%;
  font-weight:600;
  background:#ffffff;
  color:#000;
  cursor:pointer;
  transition:.3s;
}
.save-contact:hover{background:#ddd}
</style>
</head>
<body>

<audio id="welcomeSound" src="universfield-advertising-logo-199582.mp3" preload="auto"></audio>

<div class="splash">
  <img src="foto1.png" alt="Splash" />
</div>

<div class="card" id="card">
  <img src="4A0A8399 (2).jpg" class="profile-img" alt="Profile" />
  <h2>JAMILIA KERIMOVA</h2>
  <div class="position">Founder / CEO of Ish Nokady</div>

  <a href="https://www.instagram.com/jamilia_kerimova/" target="_blank" class="link-button">
    <div class="link-left"><i class="fab fa-instagram"></i>Instagram</div><span>→</span>
  </a>
  <a href="https://www.linkedin.com/in/jamilia-kerimova-0779829a" target="_blank" class="link-button">
    <div class="link-left"><i class="fab fa-linkedin"></i>LinkedIn</div><span>→</span>
  </a>
  <a href="projects.html" class="link-button">
    <div class="link-left"><i class="fas fa-briefcase"></i>Projects</div><span>→</span>
  </a>

  <button class="save-contact" onclick="downloadVCard()">Save Contact</button>
</div>

<script>
// particles
for(let i=0;i<25;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.left=Math.random()*100+'vw';
  p.style.animationDuration=6+Math.random()*6+'s';
  document.body.appendChild(p);
}

// 3D tilt effect
const card=document.getElementById('card');
document.addEventListener('mousemove',(e)=>{
  const x=(window.innerWidth/2-e.pageX)/25;
  const y=(window.innerHeight/2-e.pageY)/25;
  card.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`;
});

// vCard
function downloadVCard(){
  const vCard=`BEGIN:VCARD
VERSION:3.0
FN:Jamilia Kerimova
ORG:Ish Nokady
TITLE:Founder / CEO
EMAIL:j.kerimova@nokat.biz
URL:https://www.ishnokady.com.tm/
END:VCARD`;
  const blob=new Blob([vCard],{type:'text/vcard'});
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download='Jamilia_Kerimova.vcf';
  link.click();
}

// Play sound on first click/tap
const sound=document.getElementById('welcomeSound');
let soundPlayed=false;
document.addEventListener('click',()=>{
  if(!soundPlayed){
    sound.play().catch(()=>{});
    soundPlayed=true;
  }
});

// Hide splash automatically
window.addEventListener('load', () => {
  setTimeout(() => {
    const splash = document.querySelector('.splash');
    splash.style.transition = 'opacity 1s ease';
    splash.style.opacity = 0;
    setTimeout(() => { splash.style.display = 'none'; }, 1000);
  }, 2000);
});
</script>

</body>
</html>
