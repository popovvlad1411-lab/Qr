<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0f2027;
  overflow:hidden;
  perspective:1200px;
}

/* Animated gradient background */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:linear-gradient(45deg,#0f2027,#203a43,#2c5364,#1c1c1c);
  background-size:400% 400%;
  animation:gradientMove 12s ease infinite;
  z-index:-2;
}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* Floating particles */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  background:rgba(255,255,255,0.4);
  border-radius:50%;
  animation:floatUp 10s linear infinite;
}
@keyframes floatUp{from{transform:translateY(100vh);opacity:0}10%{opacity:1}to{transform:translateY(-10vh);opacity:0}}

/* Card */
.card{
  width:92%;
  max-width:420px;
  padding:40px 25px;
  border-radius:30px;
  backdrop-filter:blur(30px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 25px 60px rgba(0,0,0,0.6);
  text-align:center;
  color:#fff;
  transform:rotateX(10deg) rotateY(-10deg);
  transition:transform .4s ease, opacity .6s ease;
  opacity:0;
  animation:cardIn 1s ease 0.5s forwards;
}
@keyframes cardIn{to{opacity:1;transform:rotateX(0) rotateY(0)}}

h1{margin-bottom:30px;letter-spacing:1px}

/* Project buttons styled like main buttons */
.link-button{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px 20px;
  margin-bottom:15px;
  border-radius:50px;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25);
  opacity:0;
  transform:translateY(20px);
  animation:fadeButton .6s ease forwards;
}
.link-button:nth-of-type(1){animation-delay:0.7s}
.link-button:nth-of-type(2){animation-delay:0.9s}
.link-button:nth-of-type(3){animation-delay:1.1s}
@keyframes fadeButton{to{opacity:1;transform:translateY(0)}}
.link-button:hover{background:rgba(255,255,255,0.3); transform:scale(1.05);}

/* 3D tilt for card */
.card:hover{
  transform:rotateY(0deg) rotateX(0deg);
}

</style>
</head>
<body>

<div class="card" id="card">
  <h1>Projects</h1>
  
  <a href="#" class="link-button">Project 1</a>
  <a href="#" class="link-button">Project 2</a>
  <a href="#" class="link-button">Project 3</a>
</div>

<script>
// particles
for(let i=0;i<25;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.left=Math.random()*100+'vw';
  p.style.animationDuration=6+Math.random()*6+'s';
  document.body.appendChild(p);
}

// 3D tilt effect
const card=document.getElementById('card');
document.addEventListener('mousemove',(e)=>{
  const x=(window.innerWidth/2-e.pageX)/25;
  const y=(window.innerHeight/2-e.pageY)/25;
  card.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`;
});
</script>

</body>
</html>
